name: 🚀 Compress Images Automatically

on:
  push:
    paths:
      - 'Cards_Photos/**'
      - 'Heart_Photos/**'
      - '.github/workflows/compress-images.yml'
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install Pillow

      - name: 🔄 Compress Images
        run: |
          python compress_images.py

      - name: 📸 Check for Changes
        id: git-check
        run: |
          git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: 📤 Commit Compressed Images
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Cards_Photos/ Heart_Photos/
          git commit -m "♻️ Auto-compress images for better performance [skip ci]"
          git push
